
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0b">
  <title>Chúc mừng 20/10 - Nhường</title>

  <link rel="shortcut icon" href="./rose.png">
  <link rel="stylesheet" href="./style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0b0b;
      color: #f4e4ca;
    }

    .content {
      width: 100%;
      min-height: 100vh;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
    }

    .content__title {
      margin: 0;
      max-width: 100%;
      text-align: center;
    }

    .content__title:first-of-type {
      font-size: clamp(76px, 14vw, 160px);
      line-height: 1.1;
      color: #ed6500;
    }

    .content__title-sub {
      display: block;
      max-width: 1100px;
      margin: 12px auto 28px;
      padding: 0 8px;
      font-size: clamp(23px, 4.2vw, 54px);
      line-height: 1.35;
      overflow-wrap: anywhere;
      color: #b89562;
    }

    .music-player {
      width: min(420px, 90%);
      margin: 0 auto;
    }

    .music-player audio {
      display: block;
      width: 100%;
    }

    .music-note {
      margin: 12px 0 0;
      color: #b7a58d;
      font: 14px/1.6 Arial, sans-serif;
    }

    .grid {
      width: min(900px, 100%);
      margin: 0 auto 25px;
    }

    .grid__item-img {
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
    }

    @media (max-width: 600px) {
      .content {
        padding: 30px 12px;
      }

      .content__title-sub {
        margin-top: 15px;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="content">

      <!-- Ảnh kỷ niệm: cần có đủ file trong thư mục img -->
      <div class="grid">
        <div class="grid__item pos-1">
          <div class="grid__item-img"
               style="background-image:url('./img/img1.jpg')"></div>
        </div>

        <div class="grid__item pos-2">
          <div class="grid__item-img"
               style="background-image:url('./img/img2.jpg')"></div>
        </div>

        <div class="grid__item pos-3">
          <div class="grid__item-img"
               style="background-image:url('./img/img3.jpg')"></div>
        </div>

        <div class="grid__item pos-4">
          <div class="grid__item-img"
               style="background-image:url('./img/img4.jpg')"></div>
        </div>

        <div class="grid__item pos-5">
          <div class="grid__item-img"
               style="background-image:url('./img/img5.jpg')"></div>
        </div>

        <div class="grid__item pos-6">
          <div class="grid__item-img"
               style="background-image:url('./img/img6.jpg')"></div>
        </div>

        <div class="grid__item pos-7">
          <div class="grid__item-img"
               style="background-image:url('./img/img7.jpg')"></div>
        </div>

        <div class="grid__item pos-8">
          <div class="grid__item-img"
               style="background-image:url('./img/img8.jpg')"></div>
        </div>

        <div class="grid__item pos-9">
          <div class="grid__item-img"
               style="background-image:url('./img/img9.jpg')"></div>
        </div>

        <div class="grid__item pos-10">
          <div class="grid__item-img"
               style="background-image:url('./img/img10.jpg')"></div>
        </div>

        <div class="grid__item pos-11">
          <div class="grid__item-img"
               style="background-image:url('./img/img11.jpg')"></div>
        </div>
      </div>

      <!-- Lời chúc -->
      <h1 class="content__title">
        <span>Love</span>
      </h1>

      <h2 class="content__title">
        <span class="content__title-sub">
          Web này tạo ra để chúc bạn Nhường 20/10 thật vui vẻ ^^
        </span>
      </h2>

      <!-- Nhạc: file music2.mp3 phải nằm trong thư mục img -->
      <div class="music-player">
        <audio id="backgroundMusic" controls loop preload="metadata">
          <source src="./img/music2.mp3" type="audio/mpeg">
          Trình duyệt của bạn không hỗ trợ phát nhạc.
        </audio>

        <p class="music-note" id="musicMessage">
          Nhấn nút phát để nghe nhạc nhé ♡
        </p>
      </div>

    </div>
  </main>

  <script>
    const music = document.getElementById("backgroundMusic");
    const message = document.getElementById("musicMessage");

    music.addEventListener("playing", () => {
      message.textContent = "Chúc Nhường có một ngày 20/10 thật vui vẻ ♡";
    });

    music.addEventListener("error", () => {
      message.textContent =
        "Chưa tải được nhạc. Hãy kiểm tra file img/music2.mp3 trên GitHub.";
    });
  </script>
</body>
</html>
